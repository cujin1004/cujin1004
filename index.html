<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team 3 · Messenger UX Study</title>
<style>
:root{--ink:#112940;--sub:#566e80;--teal:#137b83;--mint:#eaf6f5;--line:#d5e2ea;--bg:#edf3f6;--red:#af453e;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.wrap{max-width:1130px;margin:32px auto;padding:0 20px}.panel{background:var(--white);border:1px solid #e1e9ef;border-radius:24px;padding:30px;box-shadow:0 10px 30px #15344f09}.topline{font-size:12px;color:var(--teal);font-weight:850;letter-spacing:1.5px}.hero{font-size:clamp(24px,3.6vw,38px);line-height:1.25;margin:8px 0 12px}.sub{color:var(--sub);margin:0 0 22px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-weight:750;margin-bottom:7px;font-size:14px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #c8d7e1;border-radius:12px;background:white;color:var(--ink)}.field textarea{min-height:75px}.soft{padding:16px 18px;background:var(--mint);border:1px solid #cce6e6;border-radius:15px;margin:20px 0}.soft p{margin:4px 0}.btn{border:0;border-radius:12px;background:var(--teal);color:white;font-weight:800;padding:12px 19px}.btn.outline{color:var(--ink);border:1px solid #c9d8e2;background:white}.btn.danger{color:var(--red);border:1px solid #f2c5be;background:white}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.muted{font-size:13px;color:var(--sub)}.check{display:flex;align-items:flex-start;gap:10px;margin:16px 0}.check input{margin-top:5px}.app{display:grid;grid-template-columns:245px 1fr;min-height:665px;padding:0;overflow:hidden}.sidebar{background:#f7fafb;border-right:1px solid var(--line);padding:25px 16px}.sidebar h3{margin:10px 0}.main{padding:29px 30px}.chip{display:inline-block;padding:6px 12px;border-radius:40px;border:1px solid #c7d7e1;background:#f6fafc;font-size:12px;font-weight:700}.taskbox{padding:16px;background:white;border:1px solid var(--line);border-radius:13px;margin:16px 0}.steps{font-size:13px;color:var(--sub);line-height:1.85}.progress{height:8px;background:#e9eff2;border-radius:20px;overflow:hidden;margin:10px 0 22px}.progress>div{height:100%;background:var(--teal);transition:width .2s}.tasktitle{font-size:24px;margin:9px 0}.timer{font-size:clamp(35px,6vw,61px);font-variant-numeric:tabular-nums;font-weight:850;letter-spacing:1px;margin:16px 0 4px}.statrow{display:flex;flex-wrap:wrap;gap:10px}.metric{border:1px solid var(--line);padding:13px 16px;border-radius:13px;flex:1;min-width:140px}.metric b{display:block;font-size:22px}.question{padding:19px 0;border-bottom:1px solid var(--line)}.question-title{font-weight:750;margin-bottom:12px}.rating{display:flex;gap:7px;flex-wrap:wrap}.rating label{display:flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;padding:8px 12px;border:1px solid #d9e3eb;background:#f7fafb;border-radius:10px;cursor:pointer;font-weight:700}.rating label:has(input:checked){border-color:var(--teal);background:#d6eeee;color:#07575e}.rating input{position:absolute;opacity:0;width:1px;height:1px}.rating label:focus-within{outline:2px solid var(--teal)}.pair{display:grid;grid-template-columns:160px 1fr 160px;align-items:center;gap:10px}.pair .end:first-child{text-align:right}.pair .end:last-child{text-align:left}.pair .rating{justify-content:center;flex-wrap:nowrap}.pair .rating label{min-width:38px;padding:8px}.note{padding:14px 18px;border-left:4px solid var(--teal);background:#f2f9f9;margin:18px 0}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.score{border:1px solid var(--line);padding:17px;border-radius:14px;background:#fbfdfe}.score strong{display:block;font-size:24px}.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,white 22%);padding-top:25px}.pill{display:inline-block;padding:3px 9px;background:#e9f1f4;border-radius:20px;font-size:12px;margin:4px}.hr{border:0;border-top:1px solid var(--line);margin:24px 0}.smalltitle{font-size:18px;margin:18px 0 5px}@media(max-width:800px){.wrap{margin:12px auto;padding:0 10px}.panel{padding:21px;border-radius:17px}.app{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.main{padding:20px}.formgrid,.scoregrid{grid-template-columns:1fr}.pair{grid-template-columns:1fr;gap:6px}.pair .end:first-child,.pair .end:last-child{text-align:center}.pair .rating label{min-width:35px;flex:1}.rating{gap:4px}}
</style>
</head><body><main id="root" class="wrap"></main>
<script>
'use strict';
const APPS=['KakaoTalk','WhatsApp','Messenger'];
const ORDERS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
const TASKS=[
 {id:'keyword',level:'단일 탐색',title:'대화 내 키워드 검색',desc:'연구자가 사전에 설정한 그룹 채팅에서 지정 키워드를 검색하고 해당 메시지의 확인 코드를 읽어주세요.',start:'그룹 채팅의 최신 메시지, 키보드 닫힘',end:'대상 메시지가 화면에 표시되고 참가자가 확인 코드를 읽음'},
 {id:'pin',level:'단일 탐색',title:'고정 공지 확인',desc:'그룹 대화방에서 최종 공지사항을 찾아 열고, 공지에 기록된 회의실 번호를 읽어주세요. 대화 내용을 수동으로 스크롤하지 마세요.',start:'그룹 채팅의 최신 메시지',end:'고정 공지 전문을 열고 회의실 번호를 읽음'},
 {id:'decision',level:'다단계 탐색',title:'상충된 의사결정 추적',desc:'이전 투표와 이후 메시지에 서로 다른 예산이 적혀 있습니다. 최종 확정 예산과 최종 결정자를 찾아 말해주세요.',start:'그룹 채팅의 최신 메시지',end:'최종 예산 및 결정자 모두 정확히 구두 응답'},
 {id:'assets',level:'다단계 탐색',title:'이미지·문서·링크 찾기',desc:'대화방의 자료 저장 공간을 활용해 지정 이미지, PDF, 문서 링크를 찾아주세요. 메시지 피드를 수동 스크롤하지 마세요.',start:'그룹 채팅의 최신 메시지',end:'세 자료를 확인하고 PDF 파일명과 연결 문서 제목을 읽음'}
];
const SUS=['나는 이 앱을 자주 사용하고 싶다고 생각한다.','나는 이 앱이 불필요하게 복잡하다고 느꼈다.','나는 이 앱을 사용하기 쉽다고 생각한다.','나는 이 앱을 사용하려면 기술 전문가의 도움이 필요할 것 같다.','나는 이 앱의 여러 기능이 잘 통합되어 있다고 느꼈다.','나는 이 앱에 일관성이 부족한 부분이 너무 많다고 느꼈다.','나는 대부분의 사람들이 이 앱의 사용법을 빠르게 배울 수 있을 것이라고 생각한다.','나는 이 앱이 사용하기에 매우 번거롭다고 느꼈다.','나는 이 앱을 사용하는 데 자신감을 느꼈다.','나는 이 앱을 제대로 사용하기 전에 많은 것을 배워야 한다고 느꼈다.'];
// UEQ 26 English canonical adjective pairs. Dimension mapping is provided as a practical research implementation.
const UEQ=[
 ['annoying','enjoyable','Attractiveness'],['not understandable','understandable','Perspicuity'],['creative','dull','Novelty'],['easy to learn','difficult to learn','Perspicuity'],['valuable','inferior','Attractiveness'],['boring','exciting','Stimulation'],['not interesting','interesting','Stimulation'],['unpredictable','predictable','Dependability'],['fast','slow','Efficiency'],['inventive','conventional','Novelty'],['obstructive','supportive','Dependability'],['good','bad','Attractiveness'],['complicated','easy','Perspicuity'],['unlikable','pleasing','Attractiveness'],['usual','leading edge','Novelty'],['unpleasant','pleasant','Attractiveness'],['secure','not secure','Dependability'],['motivating','demotivating','Stimulation'],['meets expectations','does not meet expectations','Dependability'],['inefficient','efficient','Efficiency'],['clear','confusing','Perspicuity'],['impractical','practical','Efficiency'],['organized','cluttered','Efficiency'],['attractive','unattractive','Attractiveness'],['friendly','unfriendly','Stimulation'],['conservative','innovative','Novelty']
];
const UEQ_POSITIVE_RIGHT=[true,true,false,false,false,true,true,true,false,false,true,false,true,true,true,true,false,false,false,true,false,true,false,false,false,true];
const TLX=[['mental','정신적 요구','얼마나 많은 생각·집중·기억이 필요했나요?'],['physical','신체적 요구','얼마나 많은 신체적 활동이 필요했나요?'],['temporal','시간적 요구','시간 압박을 얼마나 느꼈나요?'],['performance','수행 수준','과업 수행 결과에 얼마나 만족했나요? (0 매우 만족, 100 매우 불만족)'],['effort','노력','목표를 달성하기 위해 얼마나 노력했나요?'],['frustration','좌절감','얼마나 불안·스트레스·좌절을 느꼈나요?']];
const STORE='team3_messenger_ux_v1';
const blank=()=>({id:'',order:0,consent:false,frequency:{},expertise:{},stage:'setup',ai:0,ti:0,running:false,elapsed:0,startedAt:0,tasks:{},surveys:{},skippedApps:{},preferences:{},researcherNote:'',endedAt:null,createdAt:new Date().toISOString(),enabledUEQ:true,enabledTLX:true});
let state;try{state=Object.assign(blank(),JSON.parse(localStorage.getItem(STORE)||'{}'));}catch{state=blank()}
let ticker=null;
const $=s=>document.querySelector(s),root=$('#root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(STORE,JSON.stringify(state))};function advance(stage){state.stage=stage;save();render();scrollTo(0,0)};
const app=()=>APPS[ORDERS[state.order][state.ai]],key=()=>app()+'|'+TASKS[state.ti].id;
function setRun(on){if(on&&!state.running){state.startedAt=Date.now();state.running=true}else if(!on&&state.running){state.elapsed+=Math.max(0,Date.now()-state.startedAt);state.running=false;state.startedAt=0}save();timerUpdate()}
function ms(){return state.elapsed+(state.running?Date.now()-state.startedAt:0)}function fmt(t){let n=Math.max(0,Math.floor(t/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')+'.'+String(Math.floor((t%1000)/100)).padStart(1,'0')}
function timerUpdate(){const el=$('#clock');if(el)el.textContent=fmt(ms())}
function header(eyebrow,title,subtitle=''){return `<div class="topline">${eyebrow}</div><h1 class="hero">${title}</h1>${subtitle?`<p class="sub">${subtitle}</p>`:''}`}
function setup(){return `<section class="panel">${header('TEAM 3 · 연구자 설정 · 사전 설문','메신저 앱 그룹채팅 사용성 비교','카카오톡, WhatsApp, Messenger의 과업 수행 효율성과 사용자경험을 비교합니다. 이 페이지는 실제 앱의 조작을 기록하는 연구용 도구이며 메신저 앱 자체를 재현하지 않습니다.')}
<div class="formgrid"><div class="field"><label>참가자 ID (익명 코드만 입력)</label><input id="pid" placeholder="예: P01" maxlength="30" value="${esc(state.id)}"></div><div class="field"><label>앱 사용 순서 (6가지 교차 배정)</label><select id="ord">${ORDERS.map((o,i)=>`<option value="${i}" ${state.order===i?'selected':''}>${o.map(j=>APPS[j]).join(' → ')}</option>`).join('')}</select></div></div>
<div class="soft"><b>실험 흐름</b><p>사전 경험 설문 → (앱 전체 건너뛰기 가능) 3개 앱 각각 4개 과업 → 각 앱의 SUS / 선택적 UEQ / Raw NASA-TLX → 3개 앱 종합 비교 → CSV·JSON 내보내기</p><p class="muted">각 앱에 동일한 모의 그룹 채팅 기록 및 동일한 정답 정보를 미리 구성하세요. 앱 간 순서와 과업 순서는 연구자가 통제해야 합니다.</p></div>
<h3 class="smalltitle">사전 설문 · Prior Experience</h3><p class="muted">각 앱의 사용 빈도와 숙련도(1 초보 ~ 5 전문가)를 응답하세요.</p>
${APPS.map(a=>`<div class="formgrid" style="margin-bottom:14px"><div class="field"><label>${a} · 사용 빈도</label><select data-freq="${a}"><option value="">선택</option>${[['daily','매일'],['weekly','매주'],['monthly','매월'],['never','사용 경험 없음']].map(([v,t])=>`<option ${state.frequency[a]===v?'selected':''} value="${v}">${t}</option>`).join('')}</select></div><div class="field"><label>${a} · 사용 숙련도</label><select data-exp="${a}"><option value="">선택</option>${[1,2,3,4,5].map(n=>`<option ${Number(state.expertise[a])===n?'selected':''} value="${n}">${n}점</option>`).join('')}</select></div></div>`).join('')}
<div class="formgrid"><label class="check"><input id="ueqToggle" type="checkbox" ${state.enabledUEQ?'checked':''}> 앱별 UEQ 26문항 포함 (7점 척도)</label><label class="check"><input id="tlxToggle" type="checkbox" ${state.enabledTLX?'checked':''}> 앱별 Raw NASA-TLX 6문항 포함</label></div>
<label class="check"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>연구 목적과 익명 데이터 수집·로컬 저장, 언제든 참여를 중단할 수 있다는 점을 설명받고 동의합니다. 화면 녹화는 별도의 동의를 받아야 합니다.</span></label>
<div class="actions"><button id="start" class="btn">실험 시작</button><button id="reset" class="btn outline">전체 초기화</button></div><p class="muted">저장: 현재 브라우저의 localStorage에만 보관됩니다. 서버 전송 기능은 없습니다. 다른 참가자 시작 전에 파일을 내보내고 초기화하세요.</p></section>`}
function skipControls(){return `<div class="soft"><b>이 앱을 평가할 수 없나요?</b><p class="muted">앱 미사용 또는 실험 수행 불가 시, 현재 앱의 남은 과업과 SUS·UEQ·NASA-TLX를 모두 건너뜁니다.</p><div class="field"><label>건너뛰는 이유</label><select id="skipReason"><option value="not_used">해당 앱을 사용하지 않음</option><option value="no_access">설치 또는 계정 접근 불가</option><option value="unable_to_complete">과업 수행 불가</option><option value="other">기타</option></select></div><div class="actions"><button type="button" class="btn danger" id="skipApp">${esc(app())} 전체 건너뛰기 →</button></div></div>`}
function moveAfterApp(){state.running=false;state.elapsed=0;state.startedAt=0;state.ti=0;if(state.ai<2){state.ai++;advance('task')}else{const completed=APPS.filter(a=>!state.skippedApps?.[a] && state.surveys[a]?.sus?.length===10);if(completed.length<2)state.endedAt=new Date().toISOString();advance(completed.length>=2?'compare':'done')}}
function skipCurrentApp(){const a=app(),reason=$('#skipReason')?.value||'other';askConfirm('앱 전체 건너뛰기',`${a}의 남은 과업과 설문을 모두 건너뛸까요? 사유는 결과 데이터에 기록되며, 응답은 0점으로 처리하지 않습니다.`,()=>{setRun(false);state.skippedApps??={};state.skippedApps[a]={reason,at:new Date().toISOString()};for(const t of TASKS)delete state.tasks[a+'|'+t.id];delete state.surveys[a];moveAfterApp()})}
function bindSkip(){const el=$('#skipApp');if(el)el.onclick=skipCurrentApp}
function sidebar(){return `<aside class="sidebar"><div class="topline">SESSION ${state.ai+1} / 3</div><h3>${esc(app())}</h3><span class="chip">${TASKS[state.ti].level}</span><div class="taskbox"><b>과업 ${state.ti+1} / ${TASKS.length}</b><p style="margin:5px 0">${TASKS[state.ti].title}</p></div><div class="soft"><b>진행 중</b><p class="muted">실제 앱에서 과업을 수행하고 연구자가 관찰 값을 입력하세요.</p></div><p class="steps">1. 실험자는 정해진 시작 화면을 준비합니다.<br>2. 시작 버튼과 동시에 측정합니다.<br>3. 참가자가 끝났을 때 정지합니다.<br>4. 성공 여부·오류·탭 수를 기록합니다.</p><button class="btn danger" id="abort">참여 중단</button></aside>`}
function taskPage(){const t=TASKS[state.ti],r=state.tasks[key()]||{};return `<section class="panel app">${sidebar()}<div class="main"><div class="topline">APP ${state.ai+1}/3 · TASK ${state.ti+1}/${TASKS.length}</div><h1 class="tasktitle">${esc(t.title)}</h1><div class="progress"><div style="width:${((state.ai*TASKS.length+state.ti)/(APPS.length*TASKS.length))*100}%"></div></div><div class="soft"><b>과업 지시문</b><p>${esc(t.desc)}</p></div><p class="muted"><b>시작 조건:</b> ${esc(t.start)}<br><b>종료 조건:</b> ${esc(t.end)}</p><div class="timer" id="clock">${fmt(ms())}</div><div class="actions"><button id="run" class="btn">${state.running?'일시정지':'시간 측정 시작 / 재개'}</button><button id="clearTimer" class="btn outline">타이머 초기화</button></div><hr class="hr"><div class="formgrid"><div class="field"><label>완료 여부</label><select id="success"><option value="">선택</option><option value="success" ${r.success==='success'?'selected':''}>성공</option><option value="fail" ${r.success==='fail'?'selected':''}>실패</option><option value="timeout" ${r.success==='timeout'?'selected':''}>시간 초과</option></select></div><div class="field"><label>오류 횟수</label><input id="errors" type="number" min="0" step="1" value="${esc(r.errors??0)}"></div><div class="field"><label>탭 / 화면 조작 횟수 (선택)</label><input id="taps" type="number" min="0" step="1" value="${esc(r.taps??'')}"></div><div class="field"><label>Single Ease Question · SEQ (1 매우 어려움 ~ 7 매우 쉬움)</label><select id="seq"><option value="">선택</option>${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${Number(r.seq)===n?'selected':''}>${n}점</option>`).join('')}</select></div></div><div class="field" style="margin-top:15px"><label>관찰 메모 (선택)</label><textarea id="memo" placeholder="잘못 들어간 메뉴, 탐색 반복 등">${esc(r.memo||'')}</textarea></div>${skipControls()}<div class="actions sticky"><button class="btn" id="nextTask">과업 저장 및 다음 단계 →</button></div></div></section>`}
function rating(qId,max,value){return `<div class="rating">${Array.from({length:max},(_,j)=>{let n=j+1;return `<label><input type="radio" name="${esc(qId)}" value="${n}" ${Number(value)===n?'checked':''}><span>${n}</span></label>`}).join('')}</div>`}
function surveyPage(){const a=app(),r=state.surveys[a]||{},part=state.stage;let title={sus:'사용성 설문 (SUS)',ueq:'사용자 경험 설문 (UEQ)',tlx:'과업 부담 설문 (Raw NASA-TLX)'}[part];let inner='';if(part==='sus'){inner=`<div class="soft">1 = 전혀 동의하지 않음 · 2 = 동의하지 않음 · 3 = 보통 · 4 = 동의 · 5 = 매우 동의</div>${SUS.map((q,i)=>`<div class="question"><div class="question-title">${i+1}. ${esc(q)}</div>${rating('sus'+i,5,r.sus?.[i])}</div>`).join('')}`}
if(part==='ueq'){inner=`<div class="soft">각 양 끝의 단어 중 이 앱에 더 가깝다고 느껴지는 쪽을 선택하세요. 1은 왼쪽, 7은 오른쪽입니다. 원문 영어 문항이며 실제 표준화 연구에서는 공식 검증 번역본 사용을 권장합니다.</div>${UEQ.map(([l,h],i)=>`<div class="question"><div class="question-title">${i+1} / 26</div><div class="pair"><span class="end">${esc(l)}</span>${rating('ueq'+i,7,r.ueq?.[i])}<span class="end">${esc(h)}</span></div></div>`).join('')}`}
if(part==='tlx'){inner=`<div class="soft">Raw NASA-TLX는 6개 차원을 0~100점으로 평가합니다. 원래 가중 NASA-TLX와 구별되는 비가중 평균입니다.</div>${TLX.map(([id,t,desc],i)=>`<div class="question"><div class="question-title">${i+1}. ${t}</div><p class="muted">${desc}</p><div class="field"><input type="range" min="0" max="100" step="5" data-tlx="${id}" value="${r.tlx?.[id]??50}" style="width:85%"><b data-out="${id}">${r.tlx?.[id]??50}</b> / 100</div></div>`).join('')}`}
return `<section class="panel">${header(`SESSION ${state.ai+1} / 3 · ${a}` ,title,`${a}의 과업을 모두 마친 직후의 경험을 평가해주세요.`)}${inner}${skipControls()}<div class="actions sticky"><button class="btn" id="nextSurvey">설문 저장 및 계속 →</button></div></section>`}
function comparison(){const q=[['navigate','세 앱 중 정보를 찾고 이동하기 가장 쉬웠던 앱은?'],['retrieval','공지·문서 검색이 가장 편리했던 앱은?'],['multi','여러 메시지를 비교해 결론을 확인하기 가장 쉬웠던 앱은?'],['overall','앞으로 한 가지 앱만 사용해야 한다면 어떤 앱을 선택하겠나요?']];return `<section class="panel">${header('FINAL · 비교 설문','세 가지 메신저 비교 평가','평가를 완료한 앱만 비교합니다. 건너뛴 앱은 선택지에서 제외됩니다.')}${q.map(([k,t],i)=>`<div class="question"><div class="question-title">${i+1}. ${t}</div><div class="rating">${APPS.filter(a=>!state.skippedApps?.[a]).map(a=>`<label><input type="radio" name="${k}" value="${a}" ${state.preferences[k]===a?'checked':''}><span>${a}</span></label>`).join('')}</div></div>`).join('')}<div class="field" style="margin-top:18px"><label>추가 의견 (선택)</label><textarea id="finalNote" placeholder="앱별 장단점이나 어려웠던 점">${esc(state.preferences.note||'')}</textarea></div><div class="actions"><button class="btn" id="finish">결과 저장 및 종료 →</button></div></section>`}
const susScore=a=>{let ans=state.surveys[a]?.sus;if(!ans||ans.length!==10)return null;return ((ans.reduce((s,n,i)=>s+(i%2===0?n-1:5-n),0))*2.5).toFixed(1)};
function ueqScores(a){const ans=state.surveys[a]?.ueq;if(!ans||ans.length!==26)return {};let g={};ans.forEach((v,i)=>{let d=UEQ[i][2];(g[d]??=[]).push(UEQ_POSITIVE_RIGHT[i]?v-4:4-v)});return Object.fromEntries(Object.entries(g).map(([k,v])=>[k,(v.reduce((x,y)=>x+y,0)/v.length).toFixed(2)]))}
function tlxScore(a){let r=state.surveys[a]?.tlx;if(!r)return null;return (TLX.reduce((s,[k])=>s+Number(r[k]),0)/6).toFixed(1)}
function csvEscape(x){let t=String(x??'');return /[",\r\n]/.test(t)?'"'+t.replaceAll('"','""')+'"':t}
function rows(){let out=[];for(let a of APPS){for(let t of TASKS){let r=state.tasks[a+'|'+t.id]||{},s=state.surveys[a]||{},u=ueqScores(a);out.push({participant_id:state.id,app:a,app_order:ORDERS[state.order].map(n=>APPS[n]).join('>'),app_position:ORDERS[state.order].indexOf(APPS.indexOf(a))+1,frequency:state.frequency[a],expertise:state.expertise[a],task_id:t.id,complexity:t.level,app_status:state.skippedApps?.[a]?'skipped':'completed',skip_reason:state.skippedApps?.[a]?.reason||'',task_success:r.success??'',duration_seconds:r.durationMs==null?'':(r.durationMs/1000).toFixed(2),errors:r.errors??'',taps:r.taps??'',seq:r.seq??'',task_note:r.memo??'',sus_score:susScore(a)??'',raw_tlx:tlxScore(a)??'',ueq_attractiveness:u.Attractiveness??'',ueq_perspicuity:u.Perspicuity??'',ueq_efficiency:u.Efficiency??'',ueq_dependability:u.Dependability??'',ueq_stimulation:u.Stimulation??'',ueq_novelty:u.Novelty??'',preferred_navigate:state.preferences.navigate??'',preferred_retrieval:state.preferences.retrieval??'',preferred_multi:state.preferences.multi??'',preferred_overall:state.preferences.overall??''})}}return out}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),el=document.createElement('a');el.href=url;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function done(){return `<section class="panel">${header('COMPLETE · 연구 데이터','실험이 완료되었습니다','참가자별 결과를 반드시 파일로 내려받은 다음 다음 참가자를 진행하세요.')}<div class="soft"><b>참가자 ID: ${esc(state.id)}</b><p>실험 완료: ${esc(state.endedAt||'')}</p></div><div class="scoregrid">${APPS.map(a=>`<div class="score"><b>${a}</b><span class="muted">${state.skippedApps?.[a]?'앱 전체 건너뜀 ('+esc(state.skippedApps[a].reason)+')':'SUS 점수'}</span><strong>${state.skippedApps?.[a]?'해당 없음':(susScore(a)??'—')+' / 100'}</strong><span class="muted">Raw NASA-TLX: ${tlxScore(a)??'—'} / 100</span></div>`).join('')}</div><h3>기록 개요</h3><div class="statrow"><div class="metric">과업 결과 <b>${rows().filter(r=>r.task_success==='success').length} / ${rows().filter(r=>r.app_status!=='skipped').length}</b></div><div class="metric">앱 선호도 <b>${esc(state.preferences.overall||'—')}</b></div></div><div class="actions"><button id="exportCsv" class="btn">CSV 다운로드</button><button id="exportJson" class="btn outline">원본 JSON 다운로드</button><button id="newP" class="btn danger">저장 후 새 참가자 시작</button></div><p class="muted">CSV는 앱별 4행씩 총 12행이며 건너뛴 앱은 app_status=skipped 및 skip_reason으로 구분합니다. JSON은 개별 SUS·UEQ 문항까지 포함합니다. CSV 파일들은 나중에 Excel/JMP/SPSS에서 합칠 수 있습니다.</p><div class="note">중요: 이 웹사이트는 실험 중 실제 앱의 터치나 화면 전환을 자동 수집하지 못합니다. 기록은 진행자가 관찰하여 입력해야 합니다. 데이터는 GitHub Pages나 외부 서버로 전송되지 않습니다.</div></section>`}
function render(){if(ticker){clearInterval(ticker);ticker=null}root.innerHTML=state.stage==='setup'?setup():state.stage==='task'?taskPage():['sus','ueq','tlx'].includes(state.stage)?surveyPage():state.stage==='compare'?comparison():done();bind();bindSkip();if(state.stage==='task')ticker=setInterval(timerUpdate,100)}
function validSetup(){let id=$('#pid').value.trim();if(!/^[a-zA-Z0-9_-]{1,30}$/.test(id))return alert('참가자 ID는 영문, 숫자, 밑줄, 하이픈으로 1~30자 입력해주세요.'),false;if(!$('#consent').checked)return alert('참여 동의를 확인해주세요.'),false;let f={},e={};for(let a of APPS){f[a]=document.querySelector(`[data-freq="${a}"]`).value;e[a]=Number(document.querySelector(`[data-exp="${a}"]`).value);if(!f[a]||!e[a])return alert(`${a} 사전 경험 설문을 완료해주세요.`),false}state.id=id;state.order=Number($('#ord').value);state.frequency=f;state.expertise=e;state.consent=true;state.enabledUEQ=$('#ueqToggle').checked;state.enabledTLX=$('#tlxToggle').checked;return true}
function bind(){if(state.stage==='setup'){$('#start').onclick=()=>{if(validSetup()){state.ai=0;state.ti=0;state.stage='task';save();render()}};$('#reset').onclick=reset;return}
if(state.stage==='task'){$('#run').onclick=()=>{setRun(!state.running);$('#run').textContent=state.running?'일시정지':'시간 측정 시작 / 재개'};$('#clearTimer').onclick=()=>askConfirm('타이머 초기화','현재 과업의 측정 시간을 0으로 초기화할까요?',()=>{state.running=false;state.elapsed=0;state.startedAt=0;save();render()});$('#abort').onclick=()=>askConfirm('참여 중단','실험을 중단하고 초기 화면으로 이동할까요? 기존 기록은 브라우저에 남습니다.',()=>{setRun(false);advance('setup')});$('#nextTask').onclick=()=>{if(state.running)return alert('먼저 타이머를 정지해주세요.');let success=$('#success').value,errors=$('#errors').value,taps=$('#taps').value,seq=$('#seq').value;if(!success||!seq)return alert('완료 여부와 SEQ를 입력해주세요.');if(Number(errors)<0||!Number.isInteger(Number(errors))||taps!==''&&(Number(taps)<0||!Number.isInteger(Number(taps))))return alert('횟수는 0 이상의 정수로 입력해주세요.');state.tasks[key()]={success,durationMs:state.elapsed,errors:Number(errors),taps:taps===''?'':Number(taps),seq:Number(seq),memo:$('#memo').value};state.running=false;state.elapsed=0;state.startedAt=0;if(state.ti<TASKS.length-1){state.ti++;advance('task')}else{advance('sus')}};return}
if(['sus','ueq','tlx'].includes(state.stage)){if(state.stage==='tlx'){document.querySelectorAll('[data-tlx]').forEach(el=>el.oninput=()=>{document.querySelector(`[data-out="${el.dataset.tlx}"]`).textContent=el.value})}$('#nextSurvey').onclick=()=>{let a=app(),part=state.stage,cur=state.surveys[a]||{};if(part==='sus'||part==='ueq'){let count=part==='sus'?10:26,ans=[];for(let i=0;i<count;i++){let el=document.querySelector(`input[name="${part}${i}"]:checked`);if(!el)return alert(`${i+1}번 문항에 답해주세요.`);ans.push(Number(el.value))}cur[part]=ans}else{cur.tlx=Object.fromEntries(TLX.map(([id])=>[id,Number(document.querySelector(`[data-tlx="${id}"]`).value)]))}state.surveys[a]=cur;save();if(part==='sus'&&state.enabledUEQ)return advance('ueq');if((part==='sus'||part==='ueq')&&state.enabledTLX)return advance('tlx');moveAfterApp()};return}
if(state.stage==='compare'){$('#finish').onclick=()=>{let vals={};for(let k of ['navigate','retrieval','multi','overall']){let x=document.querySelector(`input[name="${k}"]:checked`);if(!x)return alert('모든 비교 질문에 응답해주세요.');vals[k]=x.value}vals.note=$('#finalNote').value;state.preferences=vals;state.endedAt=new Date().toISOString();advance('done')};return}
if(state.stage==='done'){$('#exportCsv').onclick=()=>{let rr=rows(),cols=Object.keys(rr[0]);download(`messenger_${state.id}.csv`,'\ufeff'+[cols.join(','),...rr.map(x=>cols.map(k=>csvEscape(x[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};$('#exportJson').onclick=()=>download(`messenger_${state.id}.json`,JSON.stringify({...state,methodology:{sUSItems:SUS,ueqPairs:UEQ,ueqPositiveRight:UEQ_POSITIVE_RIGHT,nasaTLXType:'Raw/unweighted'},exportedAt:new Date().toISOString()},null,2),'application/json');$('#newP').onclick=()=>{askConfirm('새 참가자 시작','CSV와 JSON 파일을 먼저 저장했나요? 기존 참가자 기록을 삭제하고 새 참가자를 시작합니다.',()=>{localStorage.removeItem(STORE);state=blank();render()})}}}
function reset(){askConfirm('전체 초기화','브라우저에 저장된 현재 참가자 기록을 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.',()=>{localStorage.removeItem(STORE);state=blank();render()})}
// In-page confirmation: browser-native confirm() is blocked in some embedded previews.
function askConfirm(title,message,action){
 document.getElementById('confirmOverlay')?.remove();
 const overlay=document.createElement('div');overlay.id='confirmOverlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-labelledby','confirmTitle');
 overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#102a4099;display:flex;align-items:center;justify-content:center;padding:20px';
 overlay.innerHTML=`<div style="background:white;color:#112940;border-radius:20px;max-width:450px;width:100%;padding:26px;box-shadow:0 20px 70px #0003"><h2 id="confirmTitle" style="margin:0 0 10px;font-size:23px">${esc(title)}</h2><p style="color:#566e80">${esc(message)}</p><div class="actions" style="justify-content:flex-end"><button type="button" class="btn outline" id="cancelConfirm">취소</button><button type="button" class="btn danger" id="acceptConfirm">확인</button></div></div>`;
 document.body.appendChild(overlay);
 const cancel=()=>overlay.remove();overlay.querySelector('#cancelConfirm').onclick=cancel;
 overlay.querySelector('#acceptConfirm').onclick=()=>{overlay.remove();action()};
 overlay.addEventListener('click',e=>{if(e.target===overlay)cancel()});
 overlay.querySelector('#cancelConfirm').focus();
}
// Stop an in-progress stopwatch after an unplanned refresh instead of charging background time.
if(state.running){state.elapsed+=Math.max(0,Date.now()-state.startedAt);state.running=false;state.startedAt=0;save()}
render();
</script></body></html>
