<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team 3 · Messenger UX Study</title>
<style>
:root{--ink:#112940;--sub:#566e80;--teal:#137b83;--mint:#eaf6f5;--line:#d5e2ea;--bg:#edf3f6;--red:#af453e;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.wrap{max-width:1130px;margin:32px auto;padding:0 20px}.panel{background:var(--white);border:1px solid #e1e9ef;border-radius:24px;padding:30px;box-shadow:0 10px 30px #15344f09}.topline{font-size:12px;color:var(--teal);font-weight:850;letter-spacing:1.5px}.hero{font-size:clamp(24px,3.6vw,38px);line-height:1.25;margin:8px 0 12px}.sub{color:var(--sub);margin:0 0 22px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-weight:750;margin-bottom:7px;font-size:14px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #c8d7e1;border-radius:12px;background:white;color:var(--ink)}.field textarea{min-height:75px}.soft{padding:16px 18px;background:var(--mint);border:1px solid #cce6e6;border-radius:15px;margin:20px 0}.soft p{margin:4px 0}.btn{border:0;border-radius:12px;background:var(--teal);color:white;font-weight:800;padding:12px 19px}.btn.outline{color:var(--ink);border:1px solid #c9d8e2;background:white}.btn.danger{color:var(--red);border:1px solid #f2c5be;background:white}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.muted{font-size:13px;color:var(--sub)}.check{display:flex;align-items:flex-start;gap:10px;margin:16px 0}.check input{margin-top:5px}.app{display:grid;grid-template-columns:245px 1fr;min-height:665px;padding:0;overflow:hidden}.sidebar{background:#f7fafb;border-right:1px solid var(--line);padding:25px 16px}.sidebar h3{margin:10px 0}.main{padding:29px 30px}.chip{display:inline-block;padding:6px 12px;border-radius:40px;border:1px solid #c7d7e1;background:#f6fafc;font-size:12px;font-weight:700}.taskbox{padding:16px;background:white;border:1px solid var(--line);border-radius:13px;margin:16px 0}.steps{font-size:13px;color:var(--sub);line-height:1.85}.progress{height:8px;background:#e9eff2;border-radius:20px;overflow:hidden;margin:10px 0 22px}.progress>div{height:100%;background:var(--teal);transition:width .2s}.tasktitle{font-size:24px;margin:9px 0}.timer{font-size:clamp(35px,6vw,61px);font-variant-numeric:tabular-nums;font-weight:850;letter-spacing:1px;margin:16px 0 4px}.statrow{display:flex;flex-wrap:wrap;gap:10px}.metric{border:1px solid var(--line);padding:13px 16px;border-radius:13px;flex:1;min-width:140px}.metric b{display:block;font-size:22px}.question{padding:19px 0;border-bottom:1px solid var(--line)}.question-title{font-weight:750;margin-bottom:12px}.rating{display:flex;gap:7px;flex-wrap:wrap}.rating label{display:flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;padding:8px 12px;border:1px solid #d9e3eb;background:#f7fafb;border-radius:10px;cursor:pointer;font-weight:700}.rating label:has(input:checked){border-color:var(--teal);background:#d6eeee;color:#07575e}.rating input{position:absolute;opacity:0;width:1px;height:1px}.rating label:focus-within{outline:2px solid var(--teal)}.pair{display:grid;grid-template-columns:160px 1fr 160px;align-items:center;gap:10px}.pair .end:first-child{text-align:right}.pair .end:last-child{text-align:left}.pair .rating{justify-content:center;flex-wrap:nowrap}.pair .rating label{min-width:38px;padding:8px}.note{padding:14px 18px;border-left:4px solid var(--teal);background:#f2f9f9;margin:18px 0}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.score{border:1px solid var(--line);padding:17px;border-radius:14px;background:#fbfdfe}.score strong{display:block;font-size:24px}.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,white 22%);padding-top:25px}.pill{display:inline-block;padding:3px 9px;background:#e9f1f4;border-radius:20px;font-size:12px;margin:4px}.hr{border:0;border-top:1px solid var(--line);margin:24px 0}.smalltitle{font-size:18px;margin:18px 0 5px}@media(max-width:800px){.wrap{margin:12px auto;padding:0 10px}.panel{padding:21px;border-radius:17px}.app{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.main{padding:20px}.formgrid,.scoregrid{grid-template-columns:1fr}.pair{grid-template-columns:1fr;gap:6px}.pair .end:first-child,.pair .end:last-child{text-align:center}.pair .rating label{min-width:35px;flex:1}.rating{gap:4px}}
</style>
</head><body><main id="root" class="wrap"></main>
<script>
'use strict';
const APPS=['KakaoTalk','WhatsApp','Messenger'];
const ORDERS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
const TASKS=[
 {id:'keyword',level:'Single-step retrieval',title:'In-chat keyword search',desc:'Search for the specified keyword in the prepared group chat and read the verification code in the target message.',start:'Latest message in the group chat; keyboard closed',end:'Target message visible; participant reads the verification code'},
 {id:'pin',level:'Single-step retrieval',title:'Find a pinned announcement',desc:'Find and open the final pinned announcement in the group chat. Read its room number aloud without manually scrolling through the chat history.',start:'Latest message in the group chat',end:'Full pinned announcement opened; participant reads the room number'},
 {id:'decision',level:'Multi-step retrieval',title:'Resolve conflicting decisions',desc:'An earlier poll and later messages show conflicting budgets. Identify the final approved budget and the person who made the final decision.',start:'Latest message in the group chat',end:'Correctly states both the final budget and decision-maker'},
 {id:'assets',level:'Multi-step retrieval',title:'Find images, documents, and links',desc:'Use the chat’s shared-media and files area to find the specified image, PDF, and document link. Do not manually scroll through the message feed.',start:'Latest message in the group chat',end:'Finds all three items and reads the PDF filename and linked document title'}
];
const SUS=['I think that I would like to use this system frequently.','I found the system unnecessarily complex.','I thought the system was easy to use.','I think that I would need the support of a technical person to be able to use this system.','I found the various functions in this system were well integrated.','I thought there was too much inconsistency in this system.','I would imagine that most people would learn to use this system very quickly.','I found the system very cumbersome to use.','I felt very confident using the system.','I needed to learn a lot of things before I could get going with this system.'];
// UEQ 26 English canonical adjective pairs. Dimension mapping is provided as a practical research implementation.
const UEQ=[
 ['annoying','enjoyable','Attractiveness'],['not understandable','understandable','Perspicuity'],['creative','dull','Novelty'],['easy to learn','difficult to learn','Perspicuity'],['valuable','inferior','Attractiveness'],['boring','exciting','Stimulation'],['not interesting','interesting','Stimulation'],['unpredictable','predictable','Dependability'],['fast','slow','Efficiency'],['inventive','conventional','Novelty'],['obstructive','supportive','Dependability'],['good','bad','Attractiveness'],['complicated','easy','Perspicuity'],['unlikable','pleasing','Attractiveness'],['usual','leading edge','Novelty'],['unpleasant','pleasant','Attractiveness'],['secure','not secure','Dependability'],['motivating','demotivating','Stimulation'],['meets expectations','does not meet expectations','Dependability'],['inefficient','efficient','Efficiency'],['clear','confusing','Perspicuity'],['impractical','practical','Efficiency'],['organized','cluttered','Efficiency'],['attractive','unattractive','Attractiveness'],['friendly','unfriendly','Stimulation'],['conservative','innovative','Novelty']
];
const UEQ_POSITIVE_RIGHT=[true,true,false,false,false,true,true,true,false,false,true,false,true,true,true,true,false,false,false,true,false,true,false,false,false,true];
const TLX=[['mental','Mental demand','How much thinking, concentration, and remembering were required?'],['physical','Physical demand','How much physical activity was required?'],['temporal','Temporal demand','How much time pressure did you feel?'],['performance','Performance','How satisfied were you with your performance? (0 = perfectly satisfied, 100 = completely dissatisfied)'],['effort','Effort','How hard did you have to work to accomplish your goal?'],['frustration','Frustration','How insecure, stressed, or frustrated did you feel?']];
const STORE='team3_messenger_ux_v1';
const blank=()=>({id:'',order:0,consent:false,frequency:{},expertise:{},stage:'setup',ai:0,ti:0,running:false,elapsed:0,startedAt:0,tasks:{},surveys:{},skippedApps:{},preferences:{},researcherNote:'',endedAt:null,createdAt:new Date().toISOString(),enabledUEQ:true,enabledTLX:true});
let state;try{state=Object.assign(blank(),JSON.parse(localStorage.getItem(STORE)||'{}'));}catch{state=blank()}
let ticker=null;
const $=s=>document.querySelector(s),root=$('#root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(STORE,JSON.stringify(state))};function advance(stage){state.stage=stage;save();render();scrollTo(0,0)};
const app=()=>APPS[ORDERS[state.order][state.ai]],key=()=>app()+'|'+TASKS[state.ti].id;
function setRun(on){if(on&&!state.running){state.startedAt=Date.now();state.running=true}else if(!on&&state.running){state.elapsed+=Math.max(0,Date.now()-state.startedAt);state.running=false;state.startedAt=0}save();timerUpdate()}
function ms(){return state.elapsed+(state.running?Date.now()-state.startedAt:0)}function fmt(t){let n=Math.max(0,Math.floor(t/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')+'.'+String(Math.floor((t%1000)/100)).padStart(1,'0')}
function timerUpdate(){const el=$('#clock');if(el)el.textContent=fmt(ms())}
function header(eyebrow,title,subtitle=''){return `<div class="topline">${eyebrow}</div><h1 class="hero">${title}</h1>${subtitle?`<p class="sub">${subtitle}</p>`:''}`}
function setup(){return `<section class="panel">${header('TEAM 3 · RESEARCH SETUP · PRE-STUDY','Group Chat Usability Comparison','Compare task efficiency and user experience across KakaoTalk, WhatsApp, and Messenger. This website records participants’ use of the actual apps; it is not a messaging-app simulator.')}
<div class="formgrid"><div class="field"><label>Participant ID (anonymous code only)</label><input id="pid" placeholder="e.g., P01" maxlength="30" value="${esc(state.id)}"></div><div class="field"><label>App order (6 counterbalanced sequences)</label><select id="ord">${ORDERS.map((o,i)=>`<option value="${i}" ${state.order===i?'selected':''}>${o.map(j=>APPS[j]).join(' → ')}</option>`).join('')}</select></div></div>
<div class="soft"><b>Study flow</b><p>Prior experience survey → 4 tasks per app (app-level skipping available) → SUS / optional UEQ / Raw NASA-TLX for each app → comparative survey → CSV and JSON export</p><p class="muted">Prepare equivalent mock group chats and answer keys in each app. Researchers should control app and task order.</p></div>
<h3 class="smalltitle">Pre-study · Prior Experience</h3><p class="muted">Report your usage frequency and familiarity with each app (1 = novice, 5 = expert).</p>
${APPS.map(a=>`<div class="formgrid" style="margin-bottom:14px"><div class="field"><label>${a} · Usage frequency</label><select data-freq="${a}"><option value="">Select</option>${[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['never','Never']].map(([v,t])=>`<option ${state.frequency[a]===v?'selected':''} value="${v}">${t}</option>`).join('')}</select></div><div class="field"><label>${a} · Self-rated expertise</label><select data-exp="${a}"><option value="">Select</option>${[1,2,3,4,5].map(n=>`<option ${Number(state.expertise[a])===n?'selected':''} value="${n}">${n}</option>`).join('')}</select></div></div>`).join('')}
<div class="formgrid"><label class="check"><input id="ueqToggle" type="checkbox" ${state.enabledUEQ?'checked':''}> Include the 26-item UEQ for each app (7-point scale)</label><label class="check"><input id="tlxToggle" type="checkbox" ${state.enabledTLX?'checked':''}> Include 6 Raw NASA-TLX items for each app</label></div>
<label class="check"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>I have been informed of the study purpose, anonymous data collection, local storage, and my right to withdraw at any time. Screen recording requires separate consent.</span></label>
<div class="actions"><button id="start" class="btn">Start study</button><button id="reset" class="btn outline">Reset all</button></div><p class="muted">Data are saved only in this browser’s local storage; nothing is sent to a server. Export the files and reset before starting another participant.</p></section>`}
function skipControls(){return `<div class="soft"><b>Unable to evaluate this app?</b><p class="muted">If you do not use this app or cannot complete the study, skip its remaining tasks and SUS, UEQ, and NASA-TLX surveys.</p><div class="field"><label>Reason for skipping</label><select id="skipReason"><option value="not_used">Do not use this app</option><option value="no_access">App not installed / account unavailable</option><option value="unable_to_complete">Unable to complete tasks</option><option value="other">Other</option></select></div><div class="actions"><button type="button" class="btn danger" id="skipApp">${esc(app())} — Skip entire app →</button></div></div>`}
function moveAfterApp(){state.running=false;state.elapsed=0;state.startedAt=0;state.ti=0;if(state.ai<2){state.ai++;advance('task')}else{const completed=APPS.filter(a=>!state.skippedApps?.[a] && state.surveys[a]?.sus?.length===10);if(completed.length<2)state.endedAt=new Date().toISOString();advance(completed.length>=2?'compare':'done')}}
function skipCurrentApp(){const a=app(),reason=$('#skipReason')?.value||'other';askConfirm('Skip entire app',`${a} — skip all remaining tasks and surveys? The reason will be recorded and missing responses will not be counted as zero.`,()=>{setRun(false);state.skippedApps??={};state.skippedApps[a]={reason,at:new Date().toISOString()};for(const t of TASKS)delete state.tasks[a+'|'+t.id];delete state.surveys[a];moveAfterApp()})}
function bindSkip(){const el=$('#skipApp');if(el)el.onclick=skipCurrentApp}
function sidebar(){return `<aside class="sidebar"><div class="topline">SESSION ${state.ai+1} / 3</div><h3>${esc(app())}</h3><span class="chip">${TASKS[state.ti].level}</span><div class="taskbox"><b>Task ${state.ti+1} / ${TASKS.length}</b><p style="margin:5px 0">${TASKS[state.ti].title}</p></div><div class="soft"><b>In progress</b><p class="muted">Complete each task in the real app. The researcher should enter the observed measurements.</p></div><p class="steps">1. Prepare the specified starting screen.<br>2. Start the timer when the task begins.<br>3. Stop it when the participant finishes.<br>4. Record success, errors, and taps.</p><button class="btn danger" id="abort">Withdraw from study</button></aside>`}
function taskPage(){const t=TASKS[state.ti],r=state.tasks[key()]||{};return `<section class="panel app">${sidebar()}<div class="main"><div class="topline">APP ${state.ai+1}/3 · TASK ${state.ti+1}/${TASKS.length}</div><h1 class="tasktitle">${esc(t.title)}</h1><div class="progress"><div style="width:${((state.ai*TASKS.length+state.ti)/(APPS.length*TASKS.length))*100}%"></div></div><div class="soft"><b>Task instructions</b><p>${esc(t.desc)}</p></div><p class="muted"><b>Starting point:</b> ${esc(t.start)}<br><b>End point:</b> ${esc(t.end)}</p><div class="timer" id="clock">${fmt(ms())}</div><div class="actions"><button id="run" class="btn">${state.running?'Pause':'Start / resume timer'}</button><button id="clearTimer" class="btn outline">Reset timer</button></div><hr class="hr"><div class="formgrid"><div class="field"><label>Task outcome</label><select id="success"><option value="">Select</option><option value="success" ${r.success==='success'?'selected':''}>Success</option><option value="fail" ${r.success==='fail'?'selected':''}>Failed</option><option value="timeout" ${r.success==='timeout'?'selected':''}>Timed out</option></select></div><div class="field"><label>Number of errors</label><input id="errors" type="number" min="0" step="1" value="${esc(r.errors??0)}"></div><div class="field"><label>Taps / screen interactions (optional)</label><input id="taps" type="number" min="0" step="1" value="${esc(r.taps??'')}"></div><div class="field"><label>Single Ease Question · SEQ (1 = very difficult, 7 = very easy)</label><select id="seq"><option value="">Select</option>${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${Number(r.seq)===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field" style="margin-top:15px"><label>Observation notes (optional)</label><textarea id="memo" placeholder="Wrong menu selections, repeated navigation, etc.">${esc(r.memo||'')}</textarea></div>${skipControls()}<div class="actions sticky"><button class="btn" id="nextTask">Save task and continue →</button></div></div></section>`}
function rating(qId,max,value){return `<div class="rating">${Array.from({length:max},(_,j)=>{let n=j+1;return `<label><input type="radio" name="${esc(qId)}" value="${n}" ${Number(value)===n?'checked':''}><span>${n}</span></label>`}).join('')}</div>`}
function surveyPage(){const a=app(),r=state.surveys[a]||{},part=state.stage;let title={sus:'System Usability Scale (SUS)',ueq:'User Experience Questionnaire (UEQ)',tlx:'Task Workload (Raw NASA-TLX)'}[part];let inner='';if(part==='sus'){inner=`<div class="soft">1 = Strongly disagree · 2 = Disagree · 3 = Neutral · 4 = Agree · 5 = Strongly agree</div>${SUS.map((q,i)=>`<div class="question"><div class="question-title">${i+1}. ${esc(q)}</div>${rating('sus'+i,5,r.sus?.[i])}</div>`).join('')}`}
if(part==='ueq'){inner=`<div class="soft">For each pair, select the point that best describes your experience. 1 corresponds to the left adjective and 7 to the right. Use the validated official questionnaire for formal research.</div>${UEQ.map(([l,h],i)=>`<div class="question"><div class="question-title">${i+1} / 26</div><div class="pair"><span class="end">${esc(l)}</span>${rating('ueq'+i,7,r.ueq?.[i])}<span class="end">${esc(h)}</span></div></div>`).join('')}`}
if(part==='tlx'){inner=`<div class="soft">Rate each of the six Raw NASA-TLX dimensions from 0 to 100. Results use the unweighted mean, rather than the original weighted NASA-TLX.</div>${TLX.map(([id,t,desc],i)=>`<div class="question"><div class="question-title">${i+1}. ${t}</div><p class="muted">${desc}</p><div class="field"><input type="range" min="0" max="100" step="5" data-tlx="${id}" value="${r.tlx?.[id]??50}" style="width:85%"><b data-out="${id}">${r.tlx?.[id]??50}</b> / 100</div></div>`).join('')}`}
return `<section class="panel">${header(`SESSION ${state.ai+1} / 3 · ${a}` ,title,`${a} — rate your experience immediately after completing this app’s tasks.`)}${inner}${skipControls()}<div class="actions sticky"><button class="btn" id="nextSurvey">Save survey and continue →</button></div></section>`}
function comparison(){const q=[['navigate','Which app was easiest to navigate and locate information in?'],['retrieval','Which app made finding announcements and documents easiest?'],['multi','Which app made it easiest to resolve information across multiple messages?'],['overall','If you had to use only one of these apps, which would you choose?']];return `<section class="panel">${header('FINAL · COMPARATIVE SURVEY','Messaging App Comparison','Compare only the apps you evaluated. Skipped apps are excluded from the options.')}${q.map(([k,t],i)=>`<div class="question"><div class="question-title">${i+1}. ${t}</div><div class="rating">${APPS.filter(a=>!state.skippedApps?.[a]).map(a=>`<label><input type="radio" name="${k}" value="${a}" ${state.preferences[k]===a?'checked':''}><span>${a}</span></label>`).join('')}</div></div>`).join('')}<div class="field" style="margin-top:18px"><label>Additional comments (optional)</label><textarea id="finalNote" placeholder="Strengths, weaknesses, or difficulties with each app">${esc(state.preferences.note||'')}</textarea></div><div class="actions"><button class="btn" id="finish">Save results and finish →</button></div></section>`}
const susScore=a=>{let ans=state.surveys[a]?.sus;if(!ans||ans.length!==10)return null;return ((ans.reduce((s,n,i)=>s+(i%2===0?n-1:5-n),0))*2.5).toFixed(1)};
function ueqScores(a){const ans=state.surveys[a]?.ueq;if(!ans||ans.length!==26)return {};let g={};ans.forEach((v,i)=>{let d=UEQ[i][2];(g[d]??=[]).push(UEQ_POSITIVE_RIGHT[i]?v-4:4-v)});return Object.fromEntries(Object.entries(g).map(([k,v])=>[k,(v.reduce((x,y)=>x+y,0)/v.length).toFixed(2)]))}
function tlxScore(a){let r=state.surveys[a]?.tlx;if(!r)return null;return (TLX.reduce((s,[k])=>s+Number(r[k]),0)/6).toFixed(1)}
function csvEscape(x){let t=String(x??'');return /[",\r\n]/.test(t)?'"'+t.replaceAll('"','""')+'"':t}
function rows(){let out=[];for(let a of APPS){for(let t of TASKS){let r=state.tasks[a+'|'+t.id]||{},s=state.surveys[a]||{},u=ueqScores(a);out.push({participant_id:state.id,app:a,app_order:ORDERS[state.order].map(n=>APPS[n]).join('>'),app_position:ORDERS[state.order].indexOf(APPS.indexOf(a))+1,frequency:state.frequency[a],expertise:state.expertise[a],task_id:t.id,complexity:t.level,app_status:state.skippedApps?.[a]?'skipped':'completed',skip_reason:state.skippedApps?.[a]?.reason||'',task_success:r.success??'',duration_seconds:r.durationMs==null?'':(r.durationMs/1000).toFixed(2),errors:r.errors??'',taps:r.taps??'',seq:r.seq??'',task_note:r.memo??'',sus_score:susScore(a)??'',raw_tlx:tlxScore(a)??'',ueq_attractiveness:u.Attractiveness??'',ueq_perspicuity:u.Perspicuity??'',ueq_efficiency:u.Efficiency??'',ueq_dependability:u.Dependability??'',ueq_stimulation:u.Stimulation??'',ueq_novelty:u.Novelty??'',preferred_navigate:state.preferences.navigate??'',preferred_retrieval:state.preferences.retrieval??'',preferred_multi:state.preferences.multi??'',preferred_overall:state.preferences.overall??''})}}return out}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),el=document.createElement('a');el.href=url;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function done(){return `<section class="panel">${header('COMPLETE · STUDY DATA','Study completed','Download the participant’s results before beginning the next session.')}<div class="soft"><b>Participant ID: ${esc(state.id)}</b><p>Completed at: ${esc(state.endedAt||'')}</p></div><div class="scoregrid">${APPS.map(a=>`<div class="score"><b>${a}</b><span class="muted">${state.skippedApps?.[a]?'Entire app skipped ('+esc(state.skippedApps[a].reason)+')':'SUS score'}</span><strong>${state.skippedApps?.[a]?'N/A':(susScore(a)??'—')+' / 100'}</strong><span class="muted">Raw NASA-TLX: ${tlxScore(a)??'—'} / 100</span></div>`).join('')}</div><h3>Record summary</h3><div class="statrow"><div class="metric">Tasks completed <b>${rows().filter(r=>r.task_success==='success').length} / ${rows().filter(r=>r.app_status!=='skipped').length}</b></div><div class="metric">Preferred app <b>${esc(state.preferences.overall||'—')}</b></div></div><div class="actions"><button id="exportCsv" class="btn">Download CSV</button><button id="exportJson" class="btn outline">Download raw JSON</button><button id="newP" class="btn danger">Start next participant</button></div><p class="muted">The CSV contains 12 task rows (four per app). Skipped apps are marked with app_status=skipped and skip_reason. JSON includes individual SUS and UEQ responses. You can combine CSV files later in Excel, JMP, or SPSS.</p><div class="note">Important: This website cannot automatically capture taps or screen transitions within the messaging apps. Researchers must enter observations manually. No data are sent to GitHub Pages or an external server.</div></section>`}
function render(){if(ticker){clearInterval(ticker);ticker=null}root.innerHTML=state.stage==='setup'?setup():state.stage==='task'?taskPage():['sus','ueq','tlx'].includes(state.stage)?surveyPage():state.stage==='compare'?comparison():done();bind();bindSkip();if(state.stage==='task')ticker=setInterval(timerUpdate,100)}
function validSetup(){let id=$('#pid').value.trim();if(!/^[a-zA-Z0-9_-]{1,30}$/.test(id))return alert('Enter a participant ID of 1–30 letters, digits, underscores, or hyphens.'),false;if(!$('#consent').checked)return alert('Please confirm informed consent.'),false;let f={},e={};for(let a of APPS){f[a]=document.querySelector(`[data-freq="${a}"]`).value;e[a]=Number(document.querySelector(`[data-exp="${a}"]`).value);if(!f[a]||!e[a])return alert(`${a} — please complete the prior experience questions.`),false}state.id=id;state.order=Number($('#ord').value);state.frequency=f;state.expertise=e;state.consent=true;state.enabledUEQ=$('#ueqToggle').checked;state.enabledTLX=$('#tlxToggle').checked;return true}
function bind(){if(state.stage==='setup'){$('#start').onclick=()=>{if(validSetup()){state.ai=0;state.ti=0;state.stage='task';save();render()}};$('#reset').onclick=reset;return}
if(state.stage==='task'){$('#run').onclick=()=>{setRun(!state.running);$('#run').textContent=state.running?'Pause':'Start / resume timer'};$('#clearTimer').onclick=()=>askConfirm('Reset timer','Reset the current task timer to zero?',()=>{state.running=false;state.elapsed=0;state.startedAt=0;save();render()});$('#abort').onclick=()=>askConfirm('Withdraw from study','Withdraw and return to the setup screen? Existing records will remain in this browser.',()=>{setRun(false);advance('setup')});$('#nextTask').onclick=()=>{if(state.running)return alert('Stop the timer first.');let success=$('#success').value,errors=$('#errors').value,taps=$('#taps').value,seq=$('#seq').value;if(!success||!seq)return alert('Enter the task outcome and SEQ rating.');if(Number(errors)<0||!Number.isInteger(Number(errors))||taps!==''&&(Number(taps)<0||!Number.isInteger(Number(taps))))return alert('Counts must be nonnegative whole numbers.');state.tasks[key()]={success,durationMs:state.elapsed,errors:Number(errors),taps:taps===''?'':Number(taps),seq:Number(seq),memo:$('#memo').value};state.running=false;state.elapsed=0;state.startedAt=0;if(state.ti<TASKS.length-1){state.ti++;advance('task')}else{advance('sus')}};return}
if(['sus','ueq','tlx'].includes(state.stage)){if(state.stage==='tlx'){document.querySelectorAll('[data-tlx]').forEach(el=>el.oninput=()=>{document.querySelector(`[data-out="${el.dataset.tlx}"]`).textContent=el.value})}$('#nextSurvey').onclick=()=>{let a=app(),part=state.stage,cur=state.surveys[a]||{};if(part==='sus'||part==='ueq'){let count=part==='sus'?10:26,ans=[];for(let i=0;i<count;i++){let el=document.querySelector(`input[name="${part}${i}"]:checked`);if(!el)return alert(`${i+1} — please answer this question.`);ans.push(Number(el.value))}cur[part]=ans}else{cur.tlx=Object.fromEntries(TLX.map(([id])=>[id,Number(document.querySelector(`[data-tlx="${id}"]`).value)]))}state.surveys[a]=cur;save();if(part==='sus'&&state.enabledUEQ)return advance('ueq');if((part==='sus'||part==='ueq')&&state.enabledTLX)return advance('tlx');moveAfterApp()};return}
if(state.stage==='compare'){$('#finish').onclick=()=>{let vals={};for(let k of ['navigate','retrieval','multi','overall']){let x=document.querySelector(`input[name="${k}"]:checked`);if(!x)return alert('Please answer all comparison questions.');vals[k]=x.value}vals.note=$('#finalNote').value;state.preferences=vals;state.endedAt=new Date().toISOString();advance('done')};return}
if(state.stage==='done'){$('#exportCsv').onclick=()=>{let rr=rows(),cols=Object.keys(rr[0]);download(`messenger_${state.id}.csv`,'\ufeff'+[cols.join(','),...rr.map(x=>cols.map(k=>csvEscape(x[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};$('#exportJson').onclick=()=>download(`messenger_${state.id}.json`,JSON.stringify({...state,methodology:{sUSItems:SUS,ueqPairs:UEQ,ueqPositiveRight:UEQ_POSITIVE_RIGHT,nasaTLXType:'Raw/unweighted'},exportedAt:new Date().toISOString()},null,2),'application/json');$('#newP').onclick=()=>{askConfirm('Start a new participant','Have you downloaded the CSV and JSON files? Starting a new participant will delete the current participant’s browser data.',()=>{localStorage.removeItem(STORE);state=blank();render()})}}}
function reset(){askConfirm('Reset all','Delete the current participant’s records stored in this browser? This cannot be undone.',()=>{localStorage.removeItem(STORE);state=blank();render()})}
// In-page confirmation: browser-native confirm() is blocked in some embedded previews.
function askConfirm(title,message,action){
 document.getElementById('confirmOverlay')?.remove();
 const overlay=document.createElement('div');overlay.id='confirmOverlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-labelledby','confirmTitle');
 overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#102a4099;display:flex;align-items:center;justify-content:center;padding:20px';
 overlay.innerHTML=`<div style="background:white;color:#112940;border-radius:20px;max-width:450px;width:100%;padding:26px;box-shadow:0 20px 70px #0003"><h2 id="confirmTitle" style="margin:0 0 10px;font-size:23px">${esc(title)}</h2><p style="color:#566e80">${esc(message)}</p><div class="actions" style="justify-content:flex-end"><button type="button" class="btn outline" id="cancelConfirm">Cancel</button><button type="button" class="btn danger" id="acceptConfirm">Confirm</button></div></div>`;
 document.body.appendChild(overlay);
 const cancel=()=>overlay.remove();overlay.querySelector('#cancelConfirm').onclick=cancel;
 overlay.querySelector('#acceptConfirm').onclick=()=>{overlay.remove();action()};
 overlay.addEventListener('click',e=>{if(e.target===overlay)cancel()});
 overlay.querySelector('#cancelConfirm').focus();
}
// Stop an in-progress stopwatch after an unplanned refresh instead of charging background time.
if(state.running){state.elapsed+=Math.max(0,Date.now()-state.startedAt);state.running=false;state.startedAt=0;save()}
render();
</script></body></html>
